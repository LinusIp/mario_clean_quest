<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plastic Patrol: Level Evolved</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 6px solid #2c3e50;
            border-radius: 12px;
            overflow: hidden;
            width: 800px;
            height: 440px;
            background: #5c94fc;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }
        .score-box {
            background: rgba(13, 17, 23, 0.85);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #34495e;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 140px;
        }
        #plastic-score { color: #00ffcc; text-shadow: 0 0 8px rgba(0,255,204,0.5); }
        #level-display { color: #ffeb3b; text-shadow: 0 0 8px rgba(255,235,59,0.5); }
        #strikes-container { color: #ff4d4d; font-size: 16px; }
        
        #screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 800px; height: 440px;
            background: rgba(13, 17, 23, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        .hidden { display: none !important; }
        h1 { margin: 0 0 10px 0; font-size: 44px; color: #00ffcc; text-shadow: 0 4px 0 #127f67; text-align: center;}
        p { margin: 0 0 25px 0; font-size: 16px; color: #a0aec0; text-align: center; line-height: 1.6; max-width: 500px; }
        
        button {
            padding: 14px 36px;
            font-size: 20px;
            font-family: inherit;
            font-weight: bold;
            background: #00ffcc;
            color: #141923;
            border: none;
            border-bottom: 4px solid #00b38f;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,255,204,0.3);
        }
        button:hover { background: #26ffd5; transform: translateY(-2px); }
        button:active { transform: translateY(2px); border-bottom-width: 0; margin-top: 4px; }
        
        #controls-guide {
            margin-top: 20px;
            font-size: 14px;
            color: #4a5568;
            text-align: center;
        }
        .highlight { color: #00ffcc; font-weight: bold; }
        .level-up { color: #ffeb3b; font-weight: bold; }
        .danger { color: #ff7675; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div class="score-box">
                <div>BOTTLES: <span id="plastic-score">0 / 5</span></div>
                <div style="font-size: 11px; color: #aaa;">TOTAL SCORE: <span id="total-score">0000</span></div>
            </div>
            <div class="score-box" style="align-items: center;">
                <div id="level-display">LEVEL 1</div>
                <div style="font-size: 12px; color: #aaa;" id="level-name">SKY ZONE</div>
            </div>
            <div class="score-box" style="align-items: flex-end;">
                <div>LIVES</div>
                <div id="strikes-container">❤️❤️❤️</div>
            </div>
        </div>
        
        <div id="screen-overlay">
            <h1 id="screen-title">PLASTIC PATROL</h1>
            <p id="screen-desc">Run right to explore the long map! Collect <span class="highlight">Plastic Bottles</span> to advance through all 3 levels.<br>Dodge <span class="danger">Organic Apple Cores & Boxes</span>!</p>
            <button id="action-btn">START GAME</button>
        </div>

        <canvas id="gameCanvas" width="800" height="440"></canvas>
    </div>

    <div id="controls-guide">
        [A / D] or [◄ / ►] to Run (Screen Scrolls) &nbsp;&bull;&nbsp; [W], [SPACE], or [▲] to Jump
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

// Level Data
const levels = {
    1: { name: "SKY ZONE", target: 5, bg: "#5c94fc", platformTop: "#2ecc71", platformBottom: "#795548", plasticChance: 0.65 },
    2: { name: "INDUSTRIAL RUINS", target: 8, bg: "#34495e", platformTop: "#e67e22", platformBottom: "#2c3e50", plasticChance: 0.50 },
    3: { name: "MIDNIGHT CORE", target: 12, bg: "#11141a", platformTop: "#9b59b6", platformBottom: "#1e272e", plasticChance: 0.40 }
};

let currentLevel = 1;
let globalScore = 0;
let levelBottlesCollected = 0;
let lives = 3;
let gameOver = false;
let gameStarted = false;
let keys = {};
let animationFrame = 0;

const worldWidth = 1600; // Double screen length
const worldHeight = 440;
const camera = { x: 0, y: 0 };

const gravity = 0.55;
const friction = 0.82;

const player = {
    x: 60, y: 300, width: 28, height: 44, // Shifted spawn x to 60 to clear floating platform overlap
    vx: 0, vy: 0, speed: 6, jumpForce: 13,
    grounded: false, facingRight: true, walkTimer: 0
};

// Map layout distributed across 1600px width
const platforms = [
    { x: 0, y: 400, width: 1600, height: 40 }, 
    { x: 140, y: 300, width: 160, height: 20 },
    { x: 340, y: 220, width: 160, height: 20 },
    { x: 100, y: 140, width: 140, height: 20 },
    { x: 580, y: 300, width: 200, height: 20 },
    { x: 840, y: 210, width: 160, height: 20 },
    { x: 650, y: 120, width: 140, height: 20 },
    { x: 1050, y: 290, width: 160, height: 20 },
    { x: 1280, y: 200, width: 180, height: 20 },
    { x: 1100, y: 110, width: 140, height: 20 },
    { x: 1480, y: 300, width: 120, height: 20 }
];

let items = [];
let spawnTimeout;

// Input tracking
window.addEventListener('keydown', e => { 
    if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault(); 
    keys[e.code] = true; 
});
window.addEventListener('keyup', e => keys[e.code] = false);
document.getElementById('action-btn').addEventListener('click', handleButtonClick);

function handleButtonClick() {
    if (!gameStarted || gameOver) {
        currentLevel = 1;
        globalScore = 0;
        lives = 3;
        setupLevel(currentLevel);
        gameStarted = true;
        gameOver = false;
        document.getElementById('screen-overlay').classList.add('hidden');
        startSpawning();
    }
}

function setupLevel(lvl) {
    levelBottlesCollected = 0;
    items = [];
    player.x = 60;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    
    container.style.backgroundColor = levels[lvl].bg;
    document.getElementById('level-display').innerText = `LEVEL ${lvl}`;
    document.getElementById('level-name').innerText = levels[lvl].name;
    updateUI();
}

function startSpawning() {
    clearTimeout(spawnTimeout);
    function spawnLoop() {
        if (gameOver || !gameStarted) return;
        
        const plat = platforms[Math.floor(Math.random() * platforms.length)];
        
        let type = 'plastic';
        if (Math.random() > levels[currentLevel].plasticChance) {
            type = Math.random() > 0.5 ? 'organic' : 'paper';
        }

        const x = plat.x + 15 + Math.random() * (plat.width - 45);
        const y = plat.y - 30;

        if (!items.some(i => Math.abs(i.x - x) < 50 && Math.abs(i.y - y) < 50)) {
            items.push({ x, y, width: 24, height: 28, type, bobOffset: Math.random() * Math.PI });
        }
        
        spawnTimeout = setTimeout(spawnLoop, Math.random() * 800 + 500);
    }
    spawnLoop();
}

function checkCollision(r1, r2) {
    return r1.x < r2.x + r2.width && r1.x + r1.width > r2.x &&
           r1.y < r2.y + r2.height && r1.y + r1.height > r2.y;
}

function update() {
    if (gameOver || !gameStarted) return;

    animationFrame++;

    // Movement engine
    if (keys['ArrowRight'] || keys['KeyD']) {
        if (player.vx < player.speed) player.vx += 0.8;
        player.facingRight = true;
        if(player.grounded) player.walkTimer += 0.25;
    } else if (keys['ArrowLeft'] || keys['KeyA']) {
        if (player.vx > -player.speed) player.vx -= 0.8;
        player.facingRight = false;
        if(player.grounded) player.walkTimer += 0.25;
    } else {
        player.walkTimer = 0;
    }

    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
    }

    player.vx *= friction;
    player.vy += gravity;
    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) { player.x = 0; player.vx = 0; }
    if (player.x + player.width > worldWidth) { player.x = worldWidth - player.width; player.vx = 0; }

    // Solid platform collisions
    player.grounded = false;
    for (let plat of platforms) {
        if (player.x + player.width > plat.x && player.x < plat.x + plat.width &&
            player.y + player.height > plat.y && player.y + player.height - player.vy <= plat.y + 12) {
            if (player.vy > 0) {
                player.grounded = true;
                player.vy = 0;
                player.y = plat.y - player.height;
            }
        }
    }

    // Camera follow tracking
    camera.x = player.x - canvas.width / 2 + player.width / 2;
    if (camera.x < 0) camera.x = 0;
    if (camera.x > worldWidth - canvas.width) camera.x = worldWidth - canvas.width;

    // Item cleanup loop with structural security check
    for (let i = items.length - 1; i >= 0; i--) {
        if (items[i] && checkCollision(player, items[i])) {
            if (items[i].type === 'plastic') {
                globalScore += 100;
                levelBottlesCollected++;
                updateUI();
                
                if (levelBottlesCollected >= levels[currentLevel].target) {
                    advanceLevel();
                    break; // FIX: Instantly halts loop context execution preventing item[i] undefined freeze
                }
            } else {
                lives--;
                updateUI();
                if (lives <= 0) {
                    endGame(false);
                    break;
                }
            }
            items.splice(i, 1);
        }
    }
}

function advanceLevel() {
    if (currentLevel < 3) {
        currentLevel++;
        setupLevel(currentLevel);
    } else {
        endGame(true);
    }
}

function updateUI() {
    const target = levels[currentLevel].target;
    document.getElementById('plastic-score').innerText = `${levelBottlesCollected} / ${target}`;
    document.getElementById('total-score').innerText = String(globalScore).padStart(4, '0');
    document.getElementById('strikes-container').innerText = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
}

function drawPlayer(ctx, p) {
    ctx.save();
    ctx.translate(p.x + p.width/2, p.y + p.height/2);
    if (!p.facingRight) ctx.scale(-1, 1);

    const bob = (!p.grounded) ? 0 : Math.sin(p.walkTimer) * 3;
    
    ctx.fillStyle = '#1e272e';
    if (!p.grounded) {
        ctx.fillRect(-10, 8, 6, 10);
        ctx.fillRect(4, 2, 6, 10);
    } else if (p.walkTimer > 0) {
        ctx.fillRect(Math.sin(p.walkTimer)*5 - 4, 8, 6, 12);
        ctx.fillRect(-Math.sin(p.walkTimer)*5 - 4, 8, 6, 12);
    } else {
        ctx.fillRect(-9, 8, 6, 14);
        ctx.fillRect(3, 8, 6, 14);
    }

    ctx.fillStyle = '#ff3f34'; 
    ctx.fillRect(-12, -12 + bob, 24, 22); 
    ctx.fillStyle = '#0abde3'; 
    ctx.fillRect(-12, -2 + bob, 24, 12);
    ctx.fillRect(-8, -8 + bob, 4, 8);
    ctx.fillRect(4, -8 + bob, 4, 8);

    ctx.fillStyle = '#ffdb99'; 
    ctx.fillRect(-8, -26 + bob, 16, 15);
    ctx.fillStyle = '#ff9f43'; 
    ctx.fillRect(-10, -30 + bob, 18, 6);
    ctx.fillRect(-2, -30 + bob, 16, 3); 

    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(3, -21 + bob, 3, 4); 
    ctx.fillStyle = '#ff7675';
    ctx.fillRect(6, -16 + bob, 3, 2); 

    ctx.restore();
}

// Map Layout Graphic Drawing Engine
function drawPlatform(ctx, plat) {
    const activeColors = levels[currentLevel];
    ctx.fillStyle = activeColors.platformBottom;
    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
    
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 2;
    for (let bx = plat.x; bx < plat.x + plat.width; bx += 20) {
        ctx.strokeRect(bx, plat.y, 20, plat.height);
    }

    ctx.fillStyle = activeColors.platformTop;
    ctx.fillRect(plat.x, plat.y, plat.width, 6);
}

function drawItem(ctx, item) {
    const bob = Math.sin(animationFrame * 0.08 + item.bobOffset) * 4;
    const cx = item.x + item.width / 2;
    const cy = item.y + item.height / 2 + bob;

    ctx.save();
    
    if (item.type === 'plastic') {
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00ffcc';
        ctx.fillStyle = 'rgba(230, 255, 255, 0.95)';
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.rect(cx - 6, cy - 4, 12, 16);
        ctx.rect(cx - 3, cy - 10, 6, 6);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#2980b9';
        ctx.fillRect(cx - 6, cy, 12, 4);
    } 
    else if (item.type === 'organic') {
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(cx, cy - 5, 7, 0, Math.PI, true);
        ctx.arc(cx, cy + 7, 7, 0, Math.PI, false);
        ctx.fill();
        ctx.fillStyle = '#f5f6fa';
        ctx.fillRect(cx - 4, cy - 5, 8, 12);
    } 
    else if (item.type === 'paper') {
        ctx.fillStyle = '#d2a679';
        ctx.strokeStyle = '#8a6d4f';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.rect(cx - 9, cy - 6, 18, 15);
        ctx.fill();
        ctx.stroke();
    }
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    for(let cx = 60; cx < worldWidth; cx += 350) {
        ctx.beginPath();
        ctx.arc(cx, 100, 20, 0, Math.PI * 2);
        ctx.arc(cx + 25, 90, 28, 0, Math.PI * 2);
        ctx.arc(cx + 50, 100, 20, 0, Math.PI * 2);
        ctx.fill();
    }

    for (let plat of platforms) { drawPlatform(ctx, plat); }
    for (let item of items) { drawItem(ctx, item); }
    drawPlayer(ctx, player);

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function endGame(victory = false) {
    gameOver = true;
    clearTimeout(spawnTimeout);
    
    const title = document.getElementById('screen-title');
    const desc = document.getElementById('screen-desc');
    const btn = document.getElementById('action-btn');
    
    if (victory) {
        title.innerText = "MISSION COMPLETED";
        title.style.color = "#ffeb3b";
        desc.innerHTML = `Awesome! You completely cleaned all sectors.<br>Final Score: <span class="highlight">${globalScore} points</span>`;
        btn.innerText = "PLAY AGAIN";
    } else {
        title.innerText = "GAME OVER";
        title.style.color = "#ff4d4d";
        desc.innerHTML = `Too much hazardous trash picked up!<br>Failed on <span class="level-up">Level ${currentLevel}</span> with ${globalScore} points.`;
        btn.innerText = "RETRY CHALLENGE";
    }
    
    document.getElementById('screen-overlay').classList.remove('hidden');
}

gameLoop();
</script>

</body>
</html>
