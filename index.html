<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plastic Patrol: 10 Levels Evolved</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 6px solid #2c3e50;
            border-radius: 12px;
            overflow: hidden;
            width: 800px;
            height: 440px;
            background: #5c94fc;
        }
        canvas { 
            display: block; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        #ui {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 2;
        }
        .score-box {
            background: rgba(13, 17, 23, 0.85);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #34495e;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 140px;
        }
        #plastic-score { color: #00ffcc; text-shadow: 0 0 8px rgba(0,255,204,0.5); }
        #level-display { color: #ffeb3b; text-shadow: 0 0 8px rgba(255,235,59,0.5); }
        #strikes-container { color: #ff4d4d; font-size: 16px; }
        
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0d1117; /* Fully opaque to hide UI behind it */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-sizing: border-box;
            padding: 20px;
        }
        .hidden { display: none !important; }
        
        h1 { margin: 0 0 5px 0; font-size: 32px; color: #00ffcc; text-shadow: 0 4px 0 #127f67; text-align: center;}
        h3 { margin: 0 0 10px 0; font-size: 14px; color: #ffeb3b; text-align: center; text-transform: uppercase; letter-spacing: 2px;}
        p { margin: 0 0 20px 0; font-size: 14px; color: #a0aec0; text-align: center; line-height: 1.6; max-width: 500px; }
        
        button {
            padding: 10px 24px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            background: #00ffcc;
            color: #141923;
            border: none;
            border-bottom: 4px solid #00b38f;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,255,204,0.3);
            transition: 0.1s;
            z-index: 15;
        }
        button:hover { background: #26ffd5; transform: translateY(-2px); }
        button:active { transform: translateY(2px); border-bottom-width: 0; margin-top: 4px; }
        button:disabled { background: #4a5568; color: #7f8c8d; border-bottom-color: #2c3e50; cursor: not-allowed; box-shadow: none; transform: none; margin-top: 0; }
        
        .btn-row { display: flex; gap: 15px; margin-top: 15px; }
        .btn-secondary {
            background: #34495e;
            color: #fff;
            border-bottom-color: #2c3e50;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn-secondary:hover { background: #455a64; }

        #ingame-btn-container {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            gap: 10px;
            z-index: 6;
        }
        .ingame-btn {
            padding: 8px 20px;
            font-size: 14px;
            font-family: inherit;
            font-weight: bold;
            border: none;
            border-bottom: 3px solid;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.1s;
        }
        .ingame-btn.restart {
            background: #ff4d4d;
            color: #fff;
            border-bottom-color: #c0392b;
            box-shadow: 0 3px 10px rgba(255,77,77,0.3);
        }
        .ingame-btn.menu {
            background: #34495e;
            color: #fff;
            border-bottom-color: #2c3e50;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }
        .ingame-btn:hover { transform: translateY(-1px); }
        .ingame-btn:active { transform: translateY(1px); border-bottom-width: 0; }
        
        #controls-guide {
            margin-top: 20px;
            font-size: 14px;
            color: #4a5568;
            text-align: center;
        }
        .highlight { color: #00ffcc; font-weight: bold; }
        .level-up { color: #ffeb3b; font-weight: bold; }
        .danger { color: #ff7675; font-weight: bold; }
        
        #transition-banner {
            position: absolute;
            top: 50%;
            left: 50%;

            text-align: center;
            pointer-events: none;
            opacity: 0;

        #transition-banner h2 {
            font-size: 48px;

            text-shadow: 0 4px 0 #b8860b, 0 0 20px rgba(255,235,59,0.5);
            margin: 0;
        }
        #transition-banner p {
            font-size: 20px;
            color: #00ffcc;
            margin: 10px 0 0 0;
        }

        /* Compact Menu & Shop Styles */
        .top-bar {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #ffeb3b;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #ffeb3b;
            z-index: 20;
        }
        .menu-container {
            display: flex;
            gap: 20px;
            margin: 5px 0 15px 0;
            align-items: flex-start;
        }
        .menu-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #34495e;
        }
        #skin-grid {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .skin-card {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border: 2px solid #34495e;
            border-radius: 4px;
            cursor: pointer;
            background: #1e272e;
            transition: 0.2s;
            pointer-events: auto;
            width: 160px;
            height: 40px;
            box-sizing: border-box;
        }
        .card-info {
            display: flex;
            flex-direction: column;
            font-size: 13px;
            text-transform: uppercase;
            font-weight: bold;
            line-height: 1.2;
        }
        .card-status {
            font-size: 11px;
            color: #ffeb3b;
            text-transform: none;
            font-weight: normal;
            margin-top: 2px;
        }
        .skin-card.selected, .shop-card.selected {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0,255,204,0.3);
            background: #2c3e50;
        }
        .skin-card.locked, .shop-card.locked {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .skin-card.selected .card-status,
        .shop-card.owned .card-status,
        .shop-card.selected .card-status {
            color: #00ffcc;
        }
        
        #level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .level-card {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #34495e;
            border-radius: 4px;
            background: #1e272e;
            pointer-events: auto;
            box-sizing: border-box;
        }
        .level-card.unlocked { color: #fff; cursor: pointer; border-color: #7f8c8d; }
        .level-card.unlocked:hover { border-color: #00ffcc; background: #2c3e50; }
        .level-card.locked { color: #4a5568; background: #141923; cursor: not-allowed; }
        .level-card.selected { border-color: #ffeb3b; box-shadow: 0 0 10px rgba(255,235,59,0.4); background: #2c3e50; }

        #shop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 550px;
        }
        .shop-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            border: 2px solid #34495e;
            border-radius: 4px;
            cursor: pointer;
            background: #1e272e;
            transition: 0.2s;
            pointer-events: auto;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

// --- SOUND SYSTEM (Web Audio API) ---
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    
    if (type === 'jump') {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(500, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.1);
    } 
    else if (type === 'collect') {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.15);
    } 
    else if (type === 'damage') {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.2);
    } 
    else if (type === 'levelup') {
        [400, 600, 800].forEach((freq, i) => {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.1);
            gain.gain.setValueAtTime(0.15, now + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.2);
        });
    } 
    else if (type === 'win') {
        [523, 659, 784, 1046].forEach((freq, i) => {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.15);
            gain.gain.setValueAtTime(0.2, now + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.3);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.3);
        });
    } 
    else if (type === 'lose') {
        [400, 300, 200, 100].forEach((freq, i) => {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + i * 0.15);
            gain.gain.setValueAtTime(0.2, now + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.3);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.3);
        });
    }
    else if (type === 'buy') {
        [800, 1000, 1200].forEach((freq, i) => {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            gain.gain.setValueAtTime(0.1, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.1);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.1);
        });
    }
}

// --- LEVEL DATA ---
const levels = {
    1:  { name: "SKY ZONE",          target: 5,  bg: "#5c94fc", platformTop: "#2ecc71", platformBottom: "#795548", plasticChance: 0.70 },
    2:  { name: "INDUSTRIAL RUINS",  target: 8,  bg: "#34495e", platformTop: "#e67e22", platformBottom: "#2c3e50", plasticChance: 0.60 },
    3:  { name: "MIDNIGHT CORE",     target: 12, bg: "#11141a", platformTop: "#9b59b6", platformBottom: "#1e272e", plasticChance: 0.50 },
    4:  { name: "TOXIC WASTES",      target: 15, bg: "#2c3e50", platformTop: "#27ae60", platformBottom: "#1a252f", plasticChance: 0.45 },
    5:  { name: "NEON ALLEY",        target: 18, bg: "#0a0a0a", platformTop: "#e74c3c", platformBottom: "#2c3e50", plasticChance: 0.40 },
    6:  { name: "CRYSTAL CAVERN",    target: 21, bg: "#1a1a2e", platformTop: "#00bcd4", platformBottom: "#16213e", plasticChance: 0.35 },
    7:  { name: "SOLAR FIELDS",      target: 24, bg: "#d35400", platformTop: "#f1c40f", platformBottom: "#7f4f1f", plasticChance: 0.30 },
    8:  { name: "SHADOW REALM",      target: 27, bg: "#000000", platformTop: "#8e44ad", platformBottom: "#2c3e50", plasticChance: 0.25 },
    9:  { name: "INFERNAL PIT",      target: 30, bg: "#4a0000", platformTop: "#ff5722", platformBottom: "#2c0000", plasticChance: 0.20 },
    10: { name: "THE FINAL SORT",    target: 35, bg: "#1a1a1a", platformTop: "#ecf0f1", platformBottom: "#000000", plasticChance: 0.15 }
};

// --- SKINS DATA (With Prices) ---
const skins = [
    { name: "Recycler",  price: 0,   shirt: '#ff3f34', pants: '#0abde3', hat: '#ff9f43' },
    { name: "Student",   price: 50,  shirt: '#ffffff', pants: '#3498db', hat: '#2c3e50' },
    { name: "Volunteer", price: 150, shirt: '#2ecc71', pants: '#795548', hat: '#f1c40f' },
    { name: "Worker",    price: 300, shirt: '#f39c12', pants: '#2c3e50', hat: '#e67e22' },
    { name: "Scientist", price: 500, shirt: '#ecf0f1', pants: '#34495e', hat: '#95a5a6' }
];

let currentLevel = 1;
let globalScore = 0;
let totalCoins = 0;
let levelBottlesCollected = 0;
let lives = 5;
let gameOver = false;
let gameStarted = false;
let levelTransitioning = false;
let keys = {};
let animationFrame = 0;

let currentSkin = skins[0];
let selectedSkinIndex = 0;
let selectedLevel = 1;
let maxUnlockedLevel = 1;
let ownedSkins = [true, false, false, false, false];

// --- SAFE LOAD PROGRESS ---
try {
    const savedMax = localStorage.getItem('pp_maxLevel');
    if (savedMax) maxUnlockedLevel = Math.min(10, Math.max(1, parseInt(savedMax) || 1));
    
    const savedSkin = localStorage.getItem('pp_skin');
    if (savedSkin !== null) {
        const skinIdx = parseInt(savedSkin);
        if (!isNaN(skinIdx) && skinIdx >= 0 && skinIdx < skins.length) selectedSkinIndex = skinIdx;
    }
    
    const savedCoins = localStorage.getItem('pp_coins');
    if (savedCoins) totalCoins = Math.max(0, parseInt(savedCoins) || 0);
    
    const savedOwned = localStorage.getItem('pp_ownedSkins');
    if (savedOwned) {
        const parsed = JSON.parse(savedOwned);
        if (Array.isArray(parsed) && parsed.length === skins.length) ownedSkins = parsed;
    }
} catch(e) { console.log("LocalStorage not available."); }

// Sanitize state to prevent crashes
if (selectedLevel < 1 || selectedLevel > 10) selectedLevel = 1;
currentSkin = skins[selectedSkinIndex];
if (!ownedSkins[selectedSkinIndex]) {
    selectedSkinIndex = 0;
    currentSkin = skins[0];
    ownedSkins[0] = true;
}

const worldWidth = 1600, worldHeight = 440;
const camera = { x: 0, y: 0 };
const gravity = 0.55, friction = 0.82;

const player = {
    x: 60, y: 300, width: 28, height: 44,
    vx: 0, vy: 0, speed: 6, jumpForce: 13,
    grounded: false, facingRight: true, walkTimer: 0
};

const platforms = [
    { x: 0, y: 400, width: 1600, height: 40 }, 
    { x: 140, y: 300, width: 160, height: 20 },
    { x: 340, y: 220, width: 160, height: 20 },
    { x: 100, y: 140, width: 140, height: 20 },
    { x: 580, y: 300, width: 200, height: 20 },
    { x: 840, y: 210, width: 160, height: 20 },
    { x: 650, y: 120, width: 140, height: 20 },
    { x: 1050, y: 290, width: 160, height: 20 },
    { x: 1280, y: 200, width: 180, height: 20 },
    { x: 1100, y: 110, width: 140, height: 20 },
    { x: 1480, y: 300, width: 120, height: 20 }
];

let items = [];
let spawnTimeout = null;

// --- MENU & SHOP LOGIC ---
function saveProgress() {
    try {
        localStorage.setItem('pp_maxLevel', maxUnlockedLevel);
        localStorage.setItem('pp_skin', selectedSkinIndex);
        localStorage.setItem('pp_coins', totalCoins);
        localStorage.setItem('pp_ownedSkins', JSON.stringify(ownedSkins));
    } catch(e) {}
}

function updateCoinDisplays() {
    const menuCoins = document.getElementById('menu-coins');
    const shopCoins = document.getElementById('shop-coins');
    if (menuCoins) menuCoins.innerText = totalCoins;
    if (shopCoins) shopCoins.innerText = totalCoins;
}

function drawSkinPreview(c, skin) {
    if (!c || !skin) return;
    const cx = c.getContext('2d');
    cx.clearRect(0, 0, c.width, c.height);
    cx.save();
    cx.translate(c.width / 2, c.height - 3);
    cx.scale(0.55, 0.55); // Scaled down to fit compact cards

    cx.fillStyle = '#1e272e';
    cx.fillRect(-9, 8, 6, 14);
    cx.fillRect(3, 8, 6, 14);

    cx.fillStyle = skin.shirt; cx.fillRect(-12, -12, 24, 22);
    cx.fillStyle = skin.pants; cx.fillRect(-12, -2, 24, 12);
    cx.fillRect(-8, -8, 4, 8); cx.fillRect(4, -8, 4, 8);

    cx.fillStyle = '#ffdb99'; cx.fillRect(-8, -26, 16, 15);
    cx.fillStyle = skin.hat; cx.fillRect(-10, -30, 18, 6); cx.fillRect(-2, -30, 16, 3);

    cx.fillStyle = '#2c3e50'; cx.fillRect(3, -21, 3, 4);
    cx.fillStyle = '#ff7675'; cx.fillRect(6, -16, 3, 2);

    cx.restore();
}

function initMenu() {
    updateCoinDisplays();
    const skinGrid = document.getElementById('skin-grid');
    if (!skinGrid) return;
    skinGrid.innerHTML = '';
    
    skins.forEach((skin, i) => {
        const card = document.createElement('div');
        const isOwned = ownedSkins[i];
        const isSelected = i === selectedSkinIndex;
        
        card.className = 'skin-card' + (isSelected ? ' selected' : '') + (!isOwned ? ' locked' : '');
        const statusText = isOwned ? (isSelected ? 'SELECTED' : 'OWNED') : `💰 ${skin.price}`;
        card.innerHTML = `<canvas width="32" height="40"></canvas><div class="card-info"><span>${skin.name}</span><span class="card-status">${statusText}</span></div>`;
        
        if (isOwned) {
            card.onclick = () => {
                selectedSkinIndex = i;
                currentSkin = skins[i];
                saveProgress();
                initMenu();
            };
        }
        skinGrid.appendChild(card);
        drawSkinPreview(card.querySelector('canvas'), skin);
    });

    const levelGrid = document.getElementById('level-grid');
    if (!levelGrid) return;
    levelGrid.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
        const card = document.createElement('div');
        const isUnlocked = i <= maxUnlockedLevel;
        card.className = 'level-card ' + (isUnlocked ? 'unlocked' : 'locked') + (i === selectedLevel ? ' selected' : '');
        card.innerText = isUnlocked ? i : '🔒';
        if (isUnlocked) {
            card.onclick = () => { selectedLevel = i; initMenu(); };
        }
        levelGrid.appendChild(card);
    }
}

function initShop() {
    updateCoinDisplays();
    const shopGrid = document.getElementById('shop-grid');
    if (!shopGrid) return;
    shopGrid.innerHTML = '';
    
    skins.forEach((skin, i) => {
        const card = document.createElement('div');
        const isOwned = ownedSkins[i];
        const isSelected = i === selectedSkinIndex;
        const canAfford = totalCoins >= skin.price;
        
        card.className = 'shop-card' + (isSelected ? ' selected' : '') + (isOwned ? ' owned' : '') + (!isOwned && !canAfford ? ' locked' : '');
        
        let statusText = '';
        if (isOwned) {
            statusText = isSelected ? 'SELECTED' : 'OWNED';
        } else {
            statusText = canAfford ? `BUY 💰${skin.price}` : `NEED 💰${skin.price}`;
        }
        
        card.innerHTML = `
            <canvas width="40" height="45"></canvas>
            <div class="card-info">
                <span>${skin.name}</span>
                <span class="card-status">${statusText}</span>
            </div>
        `;
        
        card.onclick = () => {
            if (isOwned) {
                selectedSkinIndex = i;
                currentSkin = skins[i];
                saveProgress();
                playSound('collect');
                initShop();
            } else {
                if (totalCoins >= skin.price) {
                    totalCoins -= skin.price;
                    ownedSkins[i] = true;
                    selectedSkinIndex = i;
                    currentSkin = skins[i];
                    saveProgress();
                    playSound('buy');
                    initShop();
                } else {
                    alert("Not enough coins! Collect plastic bottles to earn coins.");
                }
            }
        };
        
        shopGrid.appendChild(card);
        drawSkinPreview(card.querySelector('canvas'), skin);
    });
}

// --- INPUT & FLOW ---
window.addEventListener('keydown', e => { 
    if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault(); 
    keys[e.code] = true; 
    if (e.code === 'KeyR' && gameStarted && !gameOver) restartLevel();
});
window.addEventListener('keyup', e => keys[e.code] = false);

document.getElementById('menu-play-btn').addEventListener('click', startGameFromMenu);
document.getElementById('menu-shop-btn').addEventListener('click', () => {
    initShop();
    document.getElementById('menu-overlay').classList.add('hidden');
    document.getElementById('shop-overlay').classList.remove('hidden');
});
document.getElementById('shop-back-btn').addEventListener('click', () => {
    initMenu();
    document.getElementById('shop-overlay').classList.add('hidden');
    document.getElementById('menu-overlay').classList.remove('hidden');
});

document.getElementById('retry-btn').addEventListener('click', () => {
    document.getElementById('game-over-overlay').classList.add('hidden');
    startGameFromMenu();
});

document.getElementById('menu-btn').addEventListener('click', returnToMenu);
document.getElementById('menu-ingame-btn').addEventListener('click', returnToMenu);
document.getElementById('restart-btn').addEventListener('click', () => {
    if (gameStarted && !gameOver) restartLevel();
});

function returnToMenu() {
    gameStarted = false;
    gameOver = false;
    if (spawnTimeout) clearTimeout(spawnTimeout);
    document.getElementById('game-over-overlay').classList.add('hidden');
    document.getElementById('menu-overlay').classList.remove('hidden');
    document.getElementById('ingame-btn-container').style.display = 'none';
    initMenu();
}

function startGameFromMenu() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    
    currentLevel = selectedLevel;
    currentSkin = skins[selectedSkinIndex];
    globalScore = 0; 
    lives = 5;
    levelTransitioning = false;
    setupLevel(currentLevel);
    gameStarted = true;
    gameOver = false;
    document.getElementById('menu-overlay').classList.add('hidden');
    document.getElementById('ingame-btn-container').style.display = 'flex';
    startSpawning();
}

function restartLevel() {
    if (spawnTimeout) clearTimeout(spawnTimeout);
    lives = 5;
    globalScore = 0; 
    setupLevel(currentLevel);
    gameStarted = true;
    gameOver = false;
    document.getElementById('game-over-overlay').classList.add('hidden');
    document.getElementById('ingame-btn-container').style.display = 'flex';
    startSpawning();
}

function setupLevel(lvl) {
    levelBottlesCollected = 0;
    items = [];
    player.x = 60; player.y = 300; player.vx = 0; player.vy = 0;
    player.grounded = false; camera.x = 0;
    
    container.style.backgroundColor = levels[lvl].bg;
    document.getElementById('level-display').innerText = `LEVEL ${lvl}`;
    document.getElementById('level-name').innerText = levels[lvl].name;
    updateUI();
}

function startSpawning() {
    if (spawnTimeout) clearTimeout(spawnTimeout);
    function spawnLoop() {
        if (gameOver || !gameStarted || levelTransitioning) return;
        const plat = platforms[Math.floor(Math.random() * platforms.length)];
        let type = 'plastic';
        if (Math.random() > levels[currentLevel].plasticChance) {
            type = Math.random() > 0.5 ? 'organic' : 'paper';
        }
        const x = plat.x + 15 + Math.random() * (plat.width - 45);
        const y = plat.y - 30;
        if (!items.some(i => Math.abs(i.x - x) < 50 && Math.abs(i.y - y) < 50)) {
            items.push({ x, y, width: 24, height: 28, type, bobOffset: Math.random() * Math.PI });
        }
        spawnTimeout = setTimeout(spawnLoop, Math.random() * 800 + 500);
    }
    spawnLoop();
}

function checkCollision(r1, r2) {
    return r1.x < r2.x + r2.width && r1.x + r1.width > r2.x &&
           r1.y < r2.y + r2.height && r1.y + r1.height > r2.y;
}

function update() {
    if (gameOver || !gameStarted || levelTransitioning) return;
    animationFrame++;

    if (keys['ArrowRight'] || keys['KeyD']) {
        if (player.vx < player.speed) player.vx += 0.8;
        player.facingRight = true;
        if(player.grounded) player.walkTimer += 0.25;
    } else if (keys['ArrowLeft'] || keys['KeyA']) {
        if (player.vx > -player.speed) player.vx -= 0.8;
        player.facingRight = false;
        if(player.grounded) player.walkTimer += 0.25;
    } else { player.walkTimer = 0; }

    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
        player.vy = -player.jumpForce; player.grounded = false; playSound('jump');
    }

    player.vx *= friction; player.vy += gravity;
    player.x += player.vx; player.y += player.vy;

    if (player.x < 0) { player.x = 0; player.vx = 0; }
    if (player.x + player.width > worldWidth) { player.x = worldWidth - player.width; player.vx = 0; }

    player.grounded = false;
    for (let plat of platforms) {
        if (player.x + player.width > plat.x && player.x < plat.x + plat.width &&
            player.y + player.height > plat.y && player.y + player.height - player.vy <= plat.y + 12) {
            if (player.vy > 0) {
                player.grounded = true; player.vy = 0;
                player.y = plat.y - player.height;
            }
        }
    }

    camera.x = player.x - canvas.width / 2 + player.width / 2;
    if (camera.x < 0) camera.x = 0;
    if (camera.x > worldWidth - canvas.width) camera.x = worldWidth - canvas.width;

    const itemsSnapshot = items.slice();
    for (let i = itemsSnapshot.length - 1; i >= 0; i--) {
        const item = itemsSnapshot[i];
        if (!item) continue;
        
        if (checkCollision(player, item)) {
            if (item.type === 'plastic') {
                globalScore += 100;
                levelBottlesCollected++;
                totalCoins += 10;
                saveProgress();
                playSound('collect');
                
                const realIndex = items.indexOf(item);
                if (realIndex !== -1) items.splice(realIndex, 1);
                
                updateUI();
                
                if (levelBottlesCollected >= levels[currentLevel].target) {
                    advanceLevel();
                    break;
                }
            } else {
                lives--;
                playSound('damage');
                
                const realIndex = items.indexOf(item);
                if (realIndex !== -1) items.splice(realIndex, 1);
                
                updateUI();
                if (lives <= 0) { endGame(false); break; }
            }
        }
    }
}

function advanceLevel() {
    if (spawnTimeout) clearTimeout(spawnTimeout);
    levelTransitioning = true;
    items = [];
    
    if (currentLevel + 1 <= 10) {
        maxUnlockedLevel = Math.max(maxUnlockedLevel, currentLevel + 1);
        saveProgress();
    }
    
    if (currentLevel < 10) {
        currentLevel++;
        setupLevel(currentLevel);
        showLevelTransition();
    } else {
        endGame(true);
    }
}

function showLevelTransition() {
    playSound('levelup');
    const banner = document.getElementById('transition-banner');
    document.getElementById('banner-title').innerText = `LEVEL ${currentLevel}`;
    document.getElementById('banner-subtitle').innerText = levels[currentLevel].name;
    banner.style.opacity = '1';
    
    setTimeout(() => {
        banner.style.opacity = '0';
        levelTransitioning = false;
        startSpawning();
    }, 1800);
}

function updateUI() {
    document.getElementById('plastic-score').innerText = `${levelBottlesCollected} / ${levels[currentLevel].target}`;
    document.getElementById('total-score').innerText = String(globalScore).padStart(4, '0');
    document.getElementById('strikes-container').innerText = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 5 - lives));
}

function drawPlayer(ctx, p, skin) {
    if (!skin) skin = skins[0];
    
    ctx.save();
    ctx.translate(p.x + p.width/2, p.y + p.height/2);
    if (!p.facingRight) ctx.scale(-1, 1);

    const bob = (!p.grounded) ? 0 : Math.sin(p.walkTimer) * 3;
    
    ctx.fillStyle = '#1e272e';
    if (!p.grounded) {
        ctx.fillRect(-10, 8, 6, 10); ctx.fillRect(4, 2, 6, 10);
    } else if (p.walkTimer > 0) {
        ctx.fillRect(Math.sin(p.walkTimer)*5 - 4, 8, 6, 12);
        ctx.fillRect(-Math.sin(p.walkTimer)*5 - 4, 8, 6, 12);
    } else {
        ctx.fillRect(-9, 8, 6, 14); ctx.fillRect(3, 8, 6, 14);
    }

    ctx.fillStyle = skin.shirt; ctx.fillRect(-12, -12 + bob, 24, 22); 
    ctx.fillStyle = skin.pants; ctx.fillRect(-12, -2 + bob, 24, 12);
    ctx.fillRect(-8, -8 + bob, 4, 8); ctx.fillRect(4, -8 + bob, 4, 8);

    ctx.fillStyle = '#ffdb99'; ctx.fillRect(-8, -26 + bob, 16, 15);
    ctx.fillStyle = skin.hat; ctx.fillRect(-10, -30 + bob, 18, 6); ctx.fillRect(-2, -30 + bob, 16, 3); 

    ctx.fillStyle = '#2c3e50'; ctx.fillRect(3, -21 + bob, 3, 4); 
    ctx.fillStyle = '#ff7675'; ctx.fillRect(6, -16 + bob, 3, 2); 

    ctx.restore();
}

function drawPlatform(ctx, plat) {
    const activeColors = levels[currentLevel];
    ctx.fillStyle = activeColors.platformBottom;
    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
    
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 2;
    for (let bx = plat.x; bx < plat.x + plat.width; bx += 20) {
        ctx.strokeRect(bx, plat.y, 20, plat.height);
    }
    ctx.fillStyle = activeColors.platformTop;
    ctx.fillRect(plat.x, plat.y, plat.width, 6);
}

function drawItem(ctx, item) {
    const bob = Math.sin(animationFrame * 0.08 + item.bobOffset) * 4;
    const cx = item.x + item.width / 2;
    const cy = item.y + item.height / 2 + bob;

    ctx.save();
    if (item.type === 'plastic') {
        ctx.shadowBlur = 12; ctx.shadowColor = '#00ffcc';
        ctx.fillStyle = 'rgba(230, 255, 255, 0.95)';
        ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.rect(cx - 6, cy - 4, 12, 16); ctx.rect(cx - 3, cy - 10, 6, 6);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#2980b9'; ctx.fillRect(cx - 6, cy, 12, 4);
    } 
    else if (item.type === 'organic') {
        // Apple Core Emoji
        ctx.font = '24px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🍎', cx, cy + 2); 
    } 
    else if (item.type === 'paper') {
        // Box Emoji
        ctx.font = '24px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('📦', cx, cy + 2);
    }
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    for(let cx = 60; cx < worldWidth; cx += 350) {
        ctx.beginPath();
        ctx.arc(cx, 100, 20, 0, Math.PI * 2);
        ctx.arc(cx + 25, 90, 28, 0, Math.PI * 2);
        ctx.arc(cx + 50, 100, 20, 0, Math.PI * 2);
        ctx.fill();
    }

    for (let plat of platforms) { drawPlatform(ctx, plat); }
    for (let item of items) { drawItem(ctx, item); }
    drawPlayer(ctx, player, currentSkin);

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function endGame(victory = false) {
    gameOver = true;
    if (spawnTimeout) clearTimeout(spawnTimeout);
    document.getElementById('ingame-btn-container').style.display = 'none';
    
    const title = document.getElementById('game-over-title');
    const desc = document.getElementById('game-over-desc');
    
    if (victory) {
        playSound('win');
        title.innerText = "MISSION COMPLETED";
        title.style.color = "#ffeb3b";
        desc.innerHTML = `Awesome! You completely cleaned all 10 sectors.<br>Final Score: <span class="highlight">${globalScore} points</span>`;
    } else {
        playSound('lose');
        title.innerText = "GAME OVER";
        title.style.color = "#ff4d4d";
        desc.innerHTML = `Too much hazardous trash picked up!<br>Failed on <span class="level-up">Level ${currentLevel}</span> with ${globalScore} points.`;
    }
    
    document.getElementById('game-over-overlay').classList.remove('hidden');
}

// Initialize
initMenu();
gameLoop();
</script>
